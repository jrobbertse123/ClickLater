name: Release

# Build ClickLater.exe and publish it as a downloadable release asset
# whenever a version tag (e.g. v1.0.0) is pushed. Also runnable on demand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the exe

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Generate icon
        run: python make_icon.py

      - name: Build ClickLater.exe
        run: pyinstaller --noconfirm ClickLater.spec

      - name: Smoke-check the artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ClickLater.exe)) { throw "Build produced no exe" }
          "{0:N1} MB" -f ((Get-Item dist/ClickLater.exe).Length / 1MB)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClickLater-exe
          path: dist/ClickLater.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClickLater.exe
          generate_release_notes: true
